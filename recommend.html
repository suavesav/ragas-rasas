<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find a Raag</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inconsolata:wght@300;400&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="recommend.css">
</head>
<body>

<section class="screen guess-screen" data-screen="guess" id="screen-guess">
  <div class="screen-top">
    <div class="progress" aria-hidden="true">
      <span class="seg on"></span><span class="seg"></span><span class="seg"></span>
    </div>
    <a class="close-link" href="index.html" aria-label="Back to the compendium"></a>
  </div>

  <div class="guess-body">
    <div class="guess-prefix">It's a</div>
    <button type="button" class="word season-word" id="season-word" aria-haspopup="true">
      <span class="word-text"></span>
      <svg class="chevron" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4 7l5 5 5-5"></path></svg>
    </button>
    <button type="button" class="word time-word" id="time-word" aria-haspopup="true">
      <span class="word-text"></span>
      <svg class="chevron" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4 7l5 5 5-5"></path></svg>
    </button>
    <div class="based-on mono" id="based-on"></div>
  </div>

  <div class="guess-footer">
    <div class="hint mono">wrong? tap a word to change it</div>
    <div class="hairline"></div>
    <button type="button" class="begin mono">tap to begin</button>
  </div>
</section>

<section class="screen mood-screen" data-screen="mood" id="screen-mood" hidden>
  <div class="screen-top">
    <div class="progress" aria-hidden="true">
      <span class="seg on"></span><span class="seg on"></span><span class="seg"></span>
    </div>
    <a class="close-link" href="index.html" aria-label="Back to the compendium"></a>
  </div>

  <div class="mood-header">
    <div>
      <div class="mood-eyebrow mono" id="mood-eyebrow"></div>
      <h2 class="mood-title">How do you <em>feel</em>?</h2>
    </div>
    <div class="mood-pick-any mono">pick any</div>
  </div>

  <div class="mood-grid" id="mood-grid"></div>

  <div class="mood-actions">
    <button type="button" class="mood-find-btn" id="mood-find-btn" disabled>
      <span>find my raag</span><span class="count"></span>
    </button>
  </div>
</section>

<section class="screen reveal-screen" data-screen="reveal" id="screen-reveal" hidden>
  <div class="screen-top">
    <div class="progress" aria-hidden="true">
      <span class="seg on"></span><span class="seg on"></span><span class="seg on"></span>
    </div>
    <div class="reveal-readout mono" id="reveal-readout"></div>
    <a class="close-link" href="index.html" aria-label="Back to the compendium"></a>
  </div>

  <div class="reveal-flex">
    <div class="reveal-left">
      <div class="reveal-eyebrow mono" id="reveal-eyebrow"></div>
      <div class="reveal-name" id="reveal-name"></div>
      <div class="reveal-alt" id="reveal-alt" hidden></div>
      <div class="reveal-char" id="reveal-char"></div>
      <div class="reveal-pills" id="reveal-pills"></div>
      <div class="reveal-hint mono" id="reveal-hint" hidden></div>
    </div>

    <div class="reveal-right">
      <button type="button" class="reveal-notes-btn" id="reveal-notes-btn">
        <span class="reveal-notes-text">
          <span class="reveal-notes-swaras"></span>
          <span class="reveal-notes-label mono">full notes, aalap &amp; story</span>
        </span>
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h14M12 5l6 6-6 6"></path></svg>
      </button>
      <div class="reveal-actions">
        <button type="button" class="btn-primary" id="btn-another">another</button>
        <button type="button" class="btn-secondary" id="btn-start-over">start over</button>
      </div>
    </div>
  </div>
</section>

<div id="sheet" class="overlay" hidden>
  <button class="backdrop" data-close="sheet" aria-label="Close"></button>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <button class="sheet-close" data-close="sheet" aria-label="Close"></button>
    <div class="sheet-content" id="sheet-content"></div>
  </div>
</div>

<div id="popover" class="overlay" hidden>
  <button class="backdrop" data-close="popover" aria-label="Close"></button>
  <div class="popover-panel" role="dialog" aria-modal="true">
    <div class="popover-content" id="popover-content"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="info.js"></script>
<script src="recommend.js"></script>
</body>
</html>
